# Personal laptop: real vex and codebase-memory over the fixture repo, fake acli and workiq.
# Select with ORACLE_PROFILE=home or `profile = "home"` in ~/.oracle/config.toml.
# Build the fixture indexes first: `make fixtures`.

# Home manifests live with the profile, so registry/tools stays the work registry that
# `oracle tool add` fills one tool at a time.
registry = "home/tools"  # every manifest here is active; `oracle tool activate` adds to it
path_prepend = ["../adapters/bin", "../tests/fakes/bin"]

[env]
# The code tools see only the fixture repo, so evals do not depend on what else is indexed.
VEX_DB = "${PROFILE_DIR}/../.fixtures/vex.db"
CMM_REPOS = "acme"
