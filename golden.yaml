version: 1
# A case passes when every `expect` clause holds against the trace and output.
# `judge` is a rubric for a Sonnet-as-judge pass over Findings; it fails only on a clear miss.
cases:
  - id: events-today
    query: "important events from today"
    level: standard
    expect:
      breadth: true
      tools_any: [workiq.calendar.today, workiq.teams.search, acli.jira.search, argocd.app.history, kubectl.events]
      tools_min: 3
      findings_min: 3
      grouped_by_source: true
      coverage_names_unconfigured: true
      resolved_time_range_in_trace: true
      pointers: []
    judge: "Findings are ordered by importance, each with a pointer; nothing is invented for sources that returned nothing."

  - id: salesforce-to-cloud
    query: "how salesforce talks to cloud"
    level: standard
    expect:
      tools_all: [code-graph.find_symbol, code-graph.path_between]
      tools_any: [code-search.search, acli.confluence.search]
      findings_min: 1
      pointer_prefixes_any: ["code:"]
      pointers: []
    judge: "At least one call path with file:line hops between the two systems; a Confluence design doc is cited if one exists, otherwise Coverage says it was searched and not found."

  - id: ownership-transfer
    query: "where ownership transfer happens in code"
    level: standard
    expect:
      recipe: code.find_and_expand
      tools_all: [code-search.search, code-graph.expand]
      findings_min: 1
      pointer_prefixes_any: ["code:"]
      confidence_at_least: medium
      pointers: []
    judge: "Each finding is a code location whose expansion shows callers; confidence is high when search and graph agree on the same symbols."

  - id: who-is-andrew-neville
    query: "who is andrew neville"
    level: standard
    expect:
      breadth: true
      recipe: people.profile
      tools_all: [workiq.people.lookup]
      tools_any: [acli.jira.search, workiq.teams.search]
      findings_min: 2
      coverage_names_no_match_sources: true
      pointers: []
    judge: "Role and team come from workiq with a pointer; recent tickets or messages are listed with pointers; any source with no match is stated as no match, never guessed."
  - id: crawl-gateway-5xx
    query: "what is going on with the ingestion gateway 5xx errors"
    level: deep
    expect:
      crawl_hops_min: 3
      findings_min: 3
    judge: "Findings cover the open ticket, the gateway runbook and who wrote it (their role), each with a pointer; Coverage lists the crawl's hops; nothing is invented."
    profiles:
      home:
        expect:
          pointers: ["jira:OPS-1206", "conf:90011", "people:u-1003"]
        judge: "Findings cover the open ticket, the gateway runbook and who wrote it (Priya Raman and the role the directory gives), each with a pointer; Coverage lists the crawl's hops; nothing is invented."

  - id: design-author-team
    query: "who wrote the ownership transfer design and what team are they on"
    level: standard
    expect:
      tools_all: [acli.confluence.search, workiq.people.lookup]
      findings_min: 2
    judge: "The design doc is cited with a pointer, and its author's role and team come from the directory with a pointer; the doc and its author are separate findings; nothing is invented."
    profiles:
      home:
        expect:
          pointers: ["conf:88190", "people:u-1001"]
        judge: "The design doc is cited with a pointer, and its author Andrew Neville is named with the role (Staff Software Engineer) and team (Platform Engineering) the directory gives with a pointer; the doc and its author are separate findings; nothing is invented."

  - id: reviewer-first-name-only
    query: "who reviewed the gateway runbook"
    level: standard
    expect:
      tools_all: [acli.confluence.search, workiq.people.lookup]
      findings_min: 2
    judge: "The page naming the reviewer is cited with a pointer. If the directory holds more than one person with that name, the answer lists every candidate with a pointer and the evidence for each and says the name is ambiguous, unless the page's own evidence narrows it to one; it never picks one silently."
    profiles:
      home:
        expect:
          pointers: ["conf:90012", "people:u-1005", "people:u-1006"]
        judge: "The review page is cited with a pointer. It names only \"Jon\", and the directory holds Jon Bell and Jon Alvarez: the answer lists both, each with a pointer and role, and says the page does not say which; it never picks one silently."
